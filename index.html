<!doctype html>
<!-- Poze de pe telefon → calculator (WebRTC criptat, PeerJS). Pozele nu raman pe niciun server si nici in galeria telefonului. -->
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2024">
<meta name="robots" content="noindex">
<title>Poze</title>
<style>
  :root { --bg:#1d2024; --card:#262a30; --line:#363b43; --text:#e6e3de; --mut:#a29d95; --roz:#7fb3e6; --ok:#7cc79a; --rau:#f2b8b5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 21px; margin: 0 0 2px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--roz); display: grid; place-items: center; font-size: 20px; }
  .stare { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 16px; }
  .stare.ok { border-color: var(--ok); } .stare.rau { border-color: var(--rau); }
  .mare { display: block; width: 100%; padding: 22px 12px; margin: 0 0 12px; border: 0; border-radius: 14px; background: var(--roz); color: #1d2024;
          font: 700 21px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .mare.al2 { background: var(--card); color: var(--text); border: 1px solid var(--line); font-size: 18px; padding: 16px 12px; }
  .mare:disabled { opacity: .45; }
  .mic { background: none; border: 0; color: var(--mut); text-decoration: underline; font: inherit; font-size: 14px; padding: 6px 0; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  li { position: relative; border-radius: 10px; overflow: hidden; background: var(--card); aspect-ratio: 3 / 4; }
  li img { width: 100%; height: 100%; object-fit: cover; display: block; }
  li span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; font-size: 13px; background: rgba(0,0,0,.65); }
  .sub { color: var(--mut); font-size: 14px; }
  input[type=file] { display: none; }
  /* camera in pagina (20.10.2026: „nu vreau sa apas de fiecare data pe fa o poza, vreau sa faca continuu”) */
  #cam { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; }
  #cam[hidden] { display: none; }
  #vid { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  .cam-sus, .cam-jos { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(0,0,0,.75); }
  .cam-sus { justify-content: space-between; font-size: 16px; }
  .cam-jos { justify-content: space-between; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  #camStare { flex: 1; } #camNr { min-width: 90px; text-align: right; font-size: 15px; }
  .comut { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 15px; }
  .comut.on { background: var(--ok); color: #1d2024; border-color: var(--ok); }
  .declansator { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25); }
  .declansator:active { background: #fff; }
  #blitz { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 11; }
  #inel { position: absolute; left: 50%; top: 45%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 6px solid rgba(124,199,154,.25);
          border-top-color: var(--ok); opacity: 0; pointer-events: none; }
  #inel.on { opacity: 1; animation: rot 1s linear infinite; } @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1><span class="logo">📷</span> Poze pentru calculator</h1>
  <div id="stare" class="stare">Pornesc…</div>
  <div id="corp" hidden>
    <button class="mare" id="bPoza">📷 Pornește camera</button>
    <button class="mare al2" id="bGalerie">🖼 Alege din galerie</button>
    <input id="iPoza" type="file" accept="image/*" capture="environment">
    <input id="iGalerie" type="file" accept="image/*" multiple>
    <div class="sub">Camera rămâne deschisă: ține telefonul nemișcat deasupra plicului / foii și face singură poza; schimbi plicul → următoarea.
      Fiecare poză pleacă singură la calculator și se citește singură.</div>
    <ul id="lista"></ul>
  </div>
  <p><button class="mic" id="bUita" hidden>Leagă alt calculator (scanează din nou codul QR)</button></p>
</main>
<div id="cam" hidden>
  <div class="cam-sus"><span id="camStare">Pornesc camera…</span><button class="comut on" id="bAuto">Automat</button></div>
  <div style="position:relative;flex:1;min-height:0;display:flex"><video id="vid" playsinline muted autoplay></video><div id="inel"></div></div>
  <div class="cam-jos"><button class="comut" id="bGataCam">✓ Gata</button><button class="declansator" id="bDeclans" aria-label="Fă poza acum"></button><span id="camNr"></span></div>
</div>
<div id="blitz"></div>
<script src="peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var CHEIE = 'cod_calculator', FORMA = /^[0-9a-f]{32}$/;
  var $ = function (id) { return document.getElementById(id); };
  // codul calculatorului: din codul QR (#<32 hex>) → tinut in telefon; il scot din adresa (sa nu ramana in istoric / la distribuire)
  var dinQR = decodeURIComponent(location.hash.slice(1));
  if (FORMA.test(dinQR)) { try { localStorage.setItem(CHEIE, dinQR); } catch (e) {} history.replaceState(null, '', location.pathname); }
  var ID = ''; try { ID = localStorage.getItem(CHEIE) || ''; } catch (e) {}
  if (!FORMA.test(ID)) ID = FORMA.test(dinQR) ? dinQR : '';

  function stare(t, cls) { var s = $('stare'); s.textContent = t; s.className = 'stare' + (cls ? ' ' + cls : ''); }
  if (!ID) { stare('Scanează codul QR de pe calculator.', 'rau'); return; }
  if (!window.Peer) { stare('Nu s-a încărcat pagina complet. Reîncarcă pagina.', 'rau'); return; }
  $('corp').hidden = false; $('bUita').hidden = false;
  $('bUita').onclick = function () { if (!confirm('Uit calculatorul ăsta? Va trebui să scanezi din nou codul QR.')) return; try { localStorage.removeItem(CHEIE); } catch (e) {} location.reload(); };

  // ---------- legatura ----------
  var peer = null, conn = null, legat = false, reincerc = null;
  function leaga() {
    clearTimeout(reincerc);
    if (peer) { try { peer.destroy(); } catch (e) {} }
    legat = false; stare('Mă leg de calculator…');
    peer = new Peer();
    peer.on('open', function () {
      conn = peer.connect(ID, { reliable: true, serialization: 'binary' });
      conn.on('open', function () { legat = true; stare('✓ Legat de calculator. Poți face poze.', 'ok'); trimiteUrmatoarea(); });
      conn.on('data', function (m) { if (m && m.t === 'primit') primit(m.id); });
      conn.on('close', function () { cadere('S-a întrerupt legătura.'); });
      conn.on('error', function () { cadere('S-a întrerupt legătura.'); });
    });
    peer.on('error', function (e) {
      if (e && e.type === 'peer-unavailable') cadere('Calculatorul nu răspunde: pornește legătura pe calculator.');
      else if (e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed')) cadere('Nu am internet / serverul de legătură nu răspunde.');
      else cadere('Eroare la legătură (' + (e && e.type || e) + ').');
    });
  }
  function cadere(t) {
    if (!legat && reincerc) return;
    legat = false; coada.forEach(function (p) { if (p.st === 'trimit') { p.st = 'astept'; arataPoza(p); } });
    stare(t + ' Reîncerc singur…', 'rau'); clearTimeout(reincerc); reincerc = setTimeout(function () { reincerc = null; leaga(); }, 8000);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !legat) leaga(); }); // telefonul a stat blocat

  // ---------- pozele ----------
  var coada = [], nr = 0, trimit = false;
  async function micsoreaza(f) { // max 3000 px pe latura lunga (destul pentru citit), JPEG – mai repede pe date mobile
    var b = await createImageBitmap(f, { imageOrientation: 'from-image' });
    var k = Math.min(1, 3000 / Math.max(b.width, b.height)), c = document.createElement('canvas');
    c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
    c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); b.close && b.close();
    return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.92); });
  }
  function adauga(fisiere) {
    [].slice.call(fisiere).forEach(function (f) {
      if (!/^image\//.test(f.type)) return;
      var p = { id: Date.now() + '-' + (++nr), nume: 'telefon ' + new Date().toTimeString().slice(0, 8).replace(/:/g, '.') + ' ' + nr + '.jpg', st: 'pregatesc', url: URL.createObjectURL(f), el: null };
      coada.push(p); arataPoza(p);
      micsoreaza(f).then(function (blob) { p.blob = blob; p.st = 'astept'; arataPoza(p); trimiteUrmatoarea(); })
        .catch(function () { p.st = 'rau'; arataPoza(p); });
    });
  }
  function arataPoza(p) {
    if (!p.el) { p.el = document.createElement('li'); var im = document.createElement('img'); im.src = p.url; im.alt = ''; p.el.append(im, document.createElement('span')); $('lista').prepend(p.el); }
    p.el.querySelector('span').textContent = { pregatesc: '…', astept: '⏳ în așteptare', trimit: '⬆ se trimite', gata: '✓ la calculator', rau: '✗ nu merge' }[p.st];
    if (typeof camNr === 'function' && cam.stream) camNr();
  }
  async function trimiteUrmatoarea() {
    if (trimit || !legat || !conn) return;
    var p = coada.find(function (x) { return x.st === 'astept'; }); if (!p) return;
    trimit = true; p.st = 'trimit'; arataPoza(p);
    try { conn.send({ t: 'poza', id: p.id, nume: p.nume, tip: 'image/jpeg', date: await p.blob.arrayBuffer() }); }
    catch (e) { p.st = 'astept'; arataPoza(p); trimit = false; cadere('Nu am putut trimite.'); return; }
    p.timp = setTimeout(function () { if (p.st === 'trimit') { p.st = 'astept'; arataPoza(p); trimit = false; trimiteUrmatoarea(); } }, 120000);
  }
  function primit(id) {
    var p = coada.find(function (x) { return x.id === id; }); if (!p) return;
    clearTimeout(p.timp); p.st = 'gata'; p.blob = null; arataPoza(p); trimit = false; // poza nu mai e tinuta in telefon
    var n = coada.filter(function (x) { return x.st === 'gata'; }).length;
    stare('✓ ' + n + (n === 1 ? ' poză ajunsă' : ' poze ajunse') + ' la calculator.', 'ok');
    trimiteUrmatoarea();
  }
  // ---------- camera in pagina: poze una dupa alta, automat cand imaginea sta pe loc (sau la apasare) ----------
  // Automat: imaginea micsorata 48×36 (gri) la 4/s; poza se face cand (1) s-a schimbat fata de ultima poza (plic nou) si (2) a stat pe loc ~1 s.
  var cam = { stream: null, ic: null, auto: true, prev: null, ultim: null, stabil: 0, nou: true, t: null, ocupat: false, wl: null, n: 0 };
  var mic = document.createElement('canvas'); mic.width = 48; mic.height = 36; var mg = mic.getContext('2d', { willReadFrequently: true });
  function amprenta() {
    var v = $('vid'); if (!v.videoWidth) return null;
    mg.drawImage(v, 0, 0, 48, 36); var d = mg.getImageData(0, 0, 48, 36).data, a = new Uint8Array(48 * 36);
    for (var i = 0; i < a.length; i++) a[i] = (d[4 * i] * 3 + d[4 * i + 1] * 6 + d[4 * i + 2]) / 10;
    return a;
  }
  function dif(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }
  function contrast(a) { var m = 0, i; for (i = 0; i < a.length; i++) m += a[i]; m /= a.length; var v = 0; for (i = 0; i < a.length; i++) v += (a[i] - m) * (a[i] - m); return Math.sqrt(v / a.length); }
  function camStare(t) { $('camStare').textContent = t; }
  function camNr() {
    var drum = coada.filter(function (x) { return x.st !== 'gata' && x.st !== 'rau'; }).length;
    $('camNr').textContent = cam.n ? '📷 ' + cam.n + (drum ? ' · ⬆ ' + drum : ' · ✓') : '';
  }
  async function deschideCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('iPoza').click(); return; }
    $('cam').hidden = false; camStare('Pornesc camera…');
    try { cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 4096 }, height: { ideal: 3072 } } }); }
    catch (e) { $('cam').hidden = true; alert('Nu am voie la cameră (' + (e && e.name || e) + '). Dă voie la cameră pentru pagina asta, sau folosesc camera obișnuită.'); $('iPoza').click(); return; }
    var v = $('vid'); v.srcObject = cam.stream; try { await v.play(); } catch (e) {}
    var tr = cam.stream.getVideoTracks()[0];
    try { if (window.ImageCapture) cam.ic = new ImageCapture(tr); } catch (e) { cam.ic = null; }
    try { if (navigator.wakeLock) cam.wl = await navigator.wakeLock.request('screen'); } catch (e) {} // ecranul nu se stinge cat lucrezi
    cam.prev = cam.ultim = null; cam.stabil = 0; cam.nou = true;
    clearInterval(cam.t); cam.t = setInterval(urmareste, 250);
    camStare(cam.auto ? 'Pune plicul / foaia și ține telefonul nemișcat.' : 'Apasă butonul alb pentru poză.'); camNr();
  }
  function inchideCam() {
    clearInterval(cam.t); cam.t = null;
    if (cam.stream) cam.stream.getTracks().forEach(function (x) { x.stop(); }); cam.stream = null; cam.ic = null;
    try { if (cam.wl) cam.wl.release(); } catch (e) {} cam.wl = null;
    $('vid').srcObject = null; $('cam').hidden = true; $('inel').classList.remove('on');
  }
  function urmareste() {
    if (!cam.auto || cam.ocupat || !cam.stream) return;
    var a = amprenta(); if (!a) return;
    if (cam.prev) cam.stabil = dif(a, cam.prev) < 3.5 ? cam.stabil + 1 : 0;
    cam.prev = a;
    if (cam.ultim && dif(a, cam.ultim) > 10) cam.nou = true; // altceva in fata camerei decat la ultima poza
    var pregatit = cam.nou && contrast(a) > 12;
    $('inel').classList.toggle('on', pregatit && cam.stabil >= 1 && cam.stabil < 4);
    if (!pregatit) { camStare(cam.ultim ? 'Pune următorul plic / foaia.' : 'Îndreaptă camera spre plic / foaie.'); return; }
    if (cam.stabil < 4) { camStare('Ține nemișcat…'); return; }
    fotografiaza(a);
  }
  async function fotografiaza(a) {
    if (cam.ocupat || !cam.stream) return;
    cam.ocupat = true; $('inel').classList.remove('on');
    var b = $('blitz'); b.style.opacity = '.8'; setTimeout(function () { b.style.opacity = '0'; }, 120);
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    camStare('📸 Poză făcută…');
    var blob = null;
    if (cam.ic) { try { blob = await Promise.race([cam.ic.takePhoto(), new Promise(function (ok) { setTimeout(function () { ok(null); }, 5000); })]); } catch (e) { blob = null; } }
    if (!blob) { // din imaginea camerei, la rezolutia ei
      var v = $('vid'), c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
      blob = await new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.92); });
    }
    if (blob) { cam.n++; adauga([new File([blob], 'camera.jpg', { type: blob.type || 'image/jpeg' })]); }
    cam.ultim = a || amprenta(); cam.nou = false; cam.stabil = 0; cam.prev = null;
    camNr(); camStare(cam.auto ? '✓ Trimisă. Pune următorul plic / foaia.' : '✓ Trimisă.');
    setTimeout(function () { cam.ocupat = false; }, 700);
  }
  $('bPoza').onclick = deschideCam;
  $('bGataCam').onclick = inchideCam;
  $('bDeclans').onclick = function () { fotografiaza(amprenta()); };
  $('vid').onclick = function () { fotografiaza(amprenta()); };
  $('bAuto').onclick = function () { cam.auto = !cam.auto; this.classList.toggle('on', cam.auto); this.textContent = cam.auto ? 'Automat' : 'Manual'; $('inel').classList.remove('on');
    camStare(cam.auto ? 'Pune plicul / foaia și ține telefonul nemișcat.' : 'Apasă butonul alb pentru poză.'); };
  document.addEventListener('visibilitychange', function () { if (document.hidden && cam.stream) inchideCam(); }); // camera nu ramane pornita in fundal
  $('bGalerie').onclick = function () { $('iGalerie').click(); };
  $('iPoza').onchange = $('iGalerie').onchange = function () { adauga(this.files); this.value = ''; };
  window.addEventListener('beforeunload', function (e) { if (coada.some(function (x) { return x.st !== 'gata' && x.st !== 'rau'; })) { e.preventDefault(); e.returnValue = ''; } });
  window.__tel = { adauga: adauga, coada: function () { return coada; }, cam: cam, deschideCam: deschideCam, urmareste: urmareste }; // pentru teste
  leaga();
})();
</script>
</body>
</html>
